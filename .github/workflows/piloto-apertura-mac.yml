name: Primera apertura Mac de Mind 1.0.2

on:
  push:
    branches:
      - codex/piloto-paridad
    paths:
      - .github/workflows/piloto-apertura-mac.yml

permissions: {}

jobs:
  primera-apertura:
    if: github.actor == 'byaldodaniel' && github.triggering_actor == 'byaldodaniel'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 6
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64, filename: Mind-1.0.2-darwin-arm64.tar.gz, id: '715574386', bytes: '65742327', sha256: '351afc2e75fb192d3dd01328ce91d4d01275a7a17cdf7935b51b20b5dc8a7042' }
          - { runner: macos-15-intel, arch: x86_64, filename: Mind-1.0.2-darwin-x64.tar.gz, id: '715574397', bytes: '66507780', sha256: '9c1b35103d301cdd759c46393e40c86375fe681b277d825d5daf1422d919a897' }
    env:
      ASSET: ${{ matrix.filename }}
      EXPECTED: ${{ matrix.sha256 }}
      EXPECTED_BYTES: ${{ matrix.bytes }}
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - name: Obtener solo el candidato de este destino desde el borrador
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: '436019600'
          ASSET_ID: ${{ matrix.id }}
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/mind-gui-private"
          mkdir -m 700 "$private"
          mkdir "$RUNNER_TEMP/mind-gui-evidence"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$private/release.json"
          jq -e --argjson id "$ASSET_ID" --arg name "$ASSET" --arg hash "$EXPECTED" \
            '.draft == true and .tag_name == "codex-validacion-1.0.2-1f2c6d9" and
             ([.assets[] | select(.id == $id and .name == $name and .digest == ("sha256:" + $hash))] | length == 1)' \
            "$private/release.json" >/dev/null
          if ! curl --silent --fail --location --max-redirs 3 --max-time 90 \
            --proto '=https' --proto-redir '=https' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' \
            -D "$private/headers" -o "$private/$ASSET" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID"; then
            printf 'No se pudo descargar el candidato del borrador.\n' >&2
            exit 1
          fi
          printf '%s  %s\n' "$EXPECTED" "$private/$ASSET" | shasum -a 256 -c - >/dev/null
          python3 - "$private" <<'PY'
          from pathlib import Path
          from sys import argv
          from urllib.parse import urlsplit

          folder = Path(argv[1])
          for line in (folder / 'headers').read_text(encoding='iso-8859-1').splitlines():
              if line.lower().startswith('location:'):
                  value = line.split(':', 1)[1].strip()
                  url = urlsplit(value)
                  if (url.scheme == 'https' and url.hostname in {
                      'release-assets.githubusercontent.com', 'objects.githubusercontent.com',
                  } and not url.username and not url.password and url.query):
                      (folder / 'redirect').write_text(value, encoding='ascii')
                      break
          PY
          rm "$private/headers" "$private/release.json"
          printf 'Activo exacto del borrador verificado por SHA-256.\n'

      - name: Descargar con Chrome y observar la apertura mediante LaunchServices
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/mind-gui-private"
          evidence="$RUNNER_TEMP/mind-gui-evidence"
          facts="$evidence/observaciones.txt"
          exec > >(tee -a "$facts") 2>&1

          sw_vers
          [[ "$(uname -m)" == "$EXPECTED_ARCH" ]]
          launchctl print "gui/$(id -u)" >/dev/null
          pgrep -x WindowServer >/dev/null
          pgrep -x Finder >/dev/null
          spctl --status 2>&1 | grep -Fx 'assessments enabled'
          printf 'SHA256=%s\n' "$EXPECTED"

          python="$(command -v python3 || true)"
          chrome='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          if [[ -z "$python" || ! -x "$python" || ! -x "$chrome" || ! -s "$private/redirect" ]]; then
            printf 'resultado=no_verificado; motivo=falta Python, Chrome o la redirección HTTPS temporal.\n'
            exit 1
          fi
          downloads="$HOME/Downloads/Mind-piloto-https"
          archive="$downloads/$ASSET"
          profile="$private/chrome"
          mkdir -p "$profile/Default" "$downloads"
          "$python" -I -B - "$profile" "$downloads" <<'PY'
          import json
          from pathlib import Path
          from sys import argv

          preferences = Path(argv[1]) / 'Default' / 'Preferences'
          preferences.write_text(json.dumps({
              'download': {'default_directory': argv[2], 'prompt_for_download': False},
          }), encoding='utf8')
          PY
          url="$(cat "$private/redirect")"
          case "$url" in
            https://release-assets.githubusercontent.com/*|https://objects.githubusercontent.com/*) ;;
            *) echo 'resultado=no_verificado; motivo=destino HTTPS inesperado.'; exit 1 ;;
          esac
          "$chrome" --user-data-dir="$profile" --no-first-run --no-default-browser-check "$url" \
            >"$private/chrome.log" 2>&1 &
          browser=$!
          unset url
          trap 'kill -TERM "$browser" 2>/dev/null || true' EXIT
          has_quarantine() { /usr/bin/xattr -p com.apple.quarantine "$1" >/dev/null 2>&1; }
          for (( i = 0; i < 60; i++ )); do
            if [[ -f "$archive" ]] && [[ "$(stat -f %z "$archive")" == "$EXPECTED_BYTES" ]] \
              && has_quarantine "$archive"; then break; fi
            if ! kill -0 "$browser" 2>/dev/null; then break; fi
            sleep 1
          done
          kill -TERM "$browser" 2>/dev/null || true
          for (( i = 0; i < 12; i++ )); do
            if ! kill -0 "$browser" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$browser" 2>/dev/null; then
            printf 'resultado=no_verificado; motivo=Chrome sigue abierto; no se captura la sesión.\n'
            exit 1
          fi
          wait "$browser" || true
          trap - EXIT
          size=0
          if [[ -f "$archive" ]]; then size="$(stat -f %z "$archive")"; fi
          printf 'chrome_archivo_bytes=%s\n' "$size"
          if [[ "$size" != "$EXPECTED_BYTES" ]] || ! has_quarantine "$archive"; then
            printf 'resultado=no_verificado; motivo=Chrome no dejó el archivo completo con cuarentena natural.\n'
            exit 1
          fi
          printf '%s  %s\n' "$EXPECTED" "$archive" | shasum -a 256 -c - >/dev/null
          printf 'descarga=chrome; transporte=https; huella=coincide; cuarentena_archivo=presente\n'

          detect_product() {
            "$python" -I -B - "$downloads" "$EXPECTED_ARCH" <<'PY'
          import json
          from pathlib import Path
          from sys import argv

          root = Path(argv[1]).resolve()
          arch = 'x64' if argv[2] == 'x86_64' else argv[2]
          for glob in ('*/mind-producto.json', '*/*/mind-producto.json'):
              for manifest in root.glob(glob):
                  if not manifest.resolve().is_relative_to(root):
                      continue
                  try:
                      data = json.loads(manifest.read_text(encoding='utf-8'))
                  except (OSError, ValueError):
                      continue
                  if data.get('mindVersion') == '1.0.2' and data.get('platform') == 'darwin' and data.get('arch') == arch:
                      if (manifest.parent / 'Autorizar Mind.command').is_file():
                          print(manifest.parent)
                          raise SystemExit(0)
          raise SystemExit(1)
          PY
          }

          assisted_connection() {
            mkdir "$private/extraido-cli"
            tar -xzf "$archive" -C "$private/extraido-cli" >"$private/tar.log" 2>&1 || return 1
            "$python" -I -B - "$private/extraido-cli/Mind" <<'PY'
          import json
          import os
          from pathlib import Path
          import select
          import subprocess
          import sys

          root = Path(sys.argv[1])
          config = json.loads((root / '.mcp.json').read_text(encoding='utf-8'))['mcpServers']['mind']
          environment = {key: value for key, value in os.environ.items() if key not in {
              'MIND_BASE', 'MIND_PYTHON', 'NODE_OPTIONS', 'GH_TOKEN', 'GITHUB_TOKEN',
          }}
          environment.update(config.get('env', {}))
          process = subprocess.Popen(
              [str(root / config['command']), *config['args']],
              cwd=root, env=environment, stdin=subprocess.PIPE, stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL,
          )
          try:
              request = {'jsonrpc': '2.0', 'id': 1, 'method': 'initialize', 'params': {
                  'protocolVersion': '2025-03-26', 'capabilities': {},
                  'clientInfo': {'name': 'cliente-ficticio-piloto', 'version': '1.0'},
              }}
              process.stdin.write((json.dumps(request) + '\n').encode())
              process.stdin.flush()
              if not select.select([process.stdout], [], [], 35)[0]:
                  raise SystemExit(1)
              response = json.loads(process.stdout.readline())
              if response.get('result', {}).get('serverInfo', {}).get('name') != 'mind':
                  raise SystemExit(1)
          finally:
              process.stdin.close()
              try:
                  process.wait(timeout=4)
              except subprocess.TimeoutExpired:
                  process.terminate()
                  process.wait(timeout=4)
          PY
          }

          utility='/System/Library/CoreServices/Applications/Archive Utility.app'
          if [[ -d "$utility" ]]; then
            /usr/bin/open -a "$utility" "$archive" >"$private/open-archive.log" 2>&1 || true
          else
            /usr/bin/open "$archive" >"$private/open-archive.log" 2>&1 || true
          fi
          product=''
          for (( i = 0; i < 45; i++ )); do
            if product="$(detect_product 2>/dev/null)"; then break; fi
            product=''
            sleep 1
          done
          if [[ -z "$product" ]]; then
            printf 'extraccion_launchservices=no_completada\n'
            if assisted_connection >"$private/mcp.log" 2>&1; then
              printf 'extraccion_asistida=tar; cliente_MCP_de_prueba=conectado\n'
            else
              printf 'extraccion_asistida_o_cliente_MCP=no_verificado\n'
            fi
            printf 'resultado=no_verificado; motivo=LaunchServices no entregó la carpeta extraída.\n'
            exit 1
          fi
          if ! has_quarantine "$product/Autorizar Mind.command"; then
            printf 'extraccion_launchservices=completada; cuarentena_iniciador=ausente\n'
            printf 'resultado=no_verificado; motivo=el iniciador extraído no conserva cuarentena natural.\n'
            exit 1
          fi
          printf 'extraccion_launchservices=completada; cuarentena_iniciador=presente\n'
          if has_quarantine "$product/Runtime/node/bin/node"; then printf 'cuarentena_runtime=presente\n'; fi

          started="$(date '+%Y-%m-%d %H:%M:%S')"
          /usr/bin/open "$product/Autorizar Mind.command" >"$private/open-command.log" 2>&1 &
          first_launch=$!
          cat > "$private/window.js" <<'JXA'
          ObjC.import('CoreGraphics');
          function run() {
            const windows = ObjC.deepUnwrap($.CGWindowListCopyWindowInfo(17, 0));
            for (const owner of ['CoreServicesUIAgent', 'Terminal']) {
              const window = windows.find(item => item.kCGWindowOwnerName === owner
                && item.kCGWindowBounds?.Width >= 120 && item.kCGWindowBounds?.Height >= 75);
              if (window) return String(window.kCGWindowNumber);
            }
            return '';
          }
          JXA
          for seconds in 1 3 6; do
            sleep "$seconds"
            window_id="$(osascript -l JavaScript "$private/window.js" 2>/dev/null || true)"
            if [[ "$window_id" =~ ^[1-9][0-9]*$ ]]; then
              /usr/sbin/screencapture -x -l "$window_id" "$evidence/primera-apertura-$seconds.png" >/dev/null 2>&1 || true
            fi
          done
          if kill -0 "$first_launch" 2>/dev/null; then kill -TERM "$first_launch" 2>/dev/null || true; fi
          if wait "$first_launch"; then launch_status=0; else launch_status=$?; fi
          printf 'apertura_launchservices_codigo=%s\n' "$launch_status"
          matches="$(/usr/bin/log show --start "$started" --info --style compact \
            --predicate 'process == "syspolicyd" OR process == "amfid"' 2>/dev/null \
            | grep -Eic 'Autorizar Mind|Gatekeeper|assessment|ticket not available|quarantine' || true)"
          printf 'Eventos de política coincidentes: %s\n' "${matches:-0}"

          if ! compgen -G "$evidence/primera-apertura-*.png" >/dev/null; then
            printf 'resultado=no_verificado; motivo=el runner no entregó capturas.\n'
            exit 1
          fi
          printf 'resultado=requiere_revision_visual; abrir capturas para confirmar el aviso o el texto de Mind.\n'

      - name: Conservar únicamente evidencia de prueba
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apertura-mac-${{ matrix.arch }}
          path: ${{ runner.temp }}/mind-gui-evidence/
          retention-days: 1
          if-no-files-found: warn
