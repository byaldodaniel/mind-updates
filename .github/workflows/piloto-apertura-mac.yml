name: Primer uso Mac del ZIP universal de Mind 1.0.2

on:
  push:
    branches:
      - codex/piloto-paridad
    paths:
      - .github/workflows/piloto-apertura-mac.yml

permissions: {}

jobs:
  primera-apertura:
    if: github.actor == 'byaldodaniel' && github.triggering_actor == 'byaldodaniel'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    env:
      ASSET: Mind-1.0.2-universal.zip
      EXPECTED: '9d7df9031f066c3bd2529ec66848e22c3dd8e1c464811933f78a0f45b60f27ce'
      EXPECTED_BYTES: '440195527'
      EXPECTED_ARCH: ${{ matrix.arch }}
    steps:
      - name: Obtener acceso temporal al único ZIP del borrador
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: '436562820'
          DRAFT_TAG: 'codex-validacion-universal-1b42e12'
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/mind-gui-private"
          mkdir -m 700 "$private"
          mkdir "$RUNNER_TEMP/mind-gui-evidence"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$private/release.json"
          asset_id="$(jq -er --arg tag "$DRAFT_TAG" --arg name "$ASSET" --arg hash "$EXPECTED" \
            --argjson bytes "$EXPECTED_BYTES" '
              if .draft != true or .tag_name != $tag then error("Borrador inesperado") else
                [.assets[] | select(.name == $name and .digest == ("sha256:" + $hash) and .size == $bytes)] |
                if length == 1 then .[0].id else error("Activo ambiguo o de huella distinta") end
              end' "$private/release.json")"
          if ! status="$(curl --silent --fail --max-time 30 --max-filesize 1024 \
            --proto '=https' -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/octet-stream' \
            -D "$private/headers" -o /dev/null -w '%{http_code}' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/$asset_id")" || [[ "$status" != 302 ]]; then
            printf 'resultado=no_verificado; motivo=GitHub no entregó la redirección HTTPS del candidato.\n'
            exit 1
          fi
          python3 -I -B - "$private" <<'PY'
          from pathlib import Path
          from sys import argv
          from urllib.parse import urlsplit

          folder = Path(argv[1])
          for line in (folder / 'headers').read_text(encoding='iso-8859-1').splitlines():
              if not line.lower().startswith('location:'):
                  continue
              value = line.split(':', 1)[1].strip()
              url = urlsplit(value)
              if (url.scheme == 'https' and url.hostname in {
                  'release-assets.githubusercontent.com', 'objects.githubusercontent.com',
              } and not url.username and not url.password and url.query):
                  (folder / 'redirect').write_text(value, encoding='ascii')
                  break
          else:
              raise SystemExit('resultado=no_verificado; motivo=destino HTTPS inesperado.')
          PY
          rm "$private/headers" "$private/release.json"
          printf 'activo_del_borrador=verificado_por_nombre_tamaño_y_huella\n'

      - name: Descargar, extraer y verificar la conexión MCP en Mac
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          private="$RUNNER_TEMP/mind-gui-private"
          evidence="$RUNNER_TEMP/mind-gui-evidence"
          facts="$evidence/observaciones.txt"
          exec > >(tee -a "$facts") 2>&1

          sw_vers
          [[ "$(uname -m)" == "$EXPECTED_ARCH" ]]
          launchctl print "gui/$(id -u)" >/dev/null
          pgrep -x WindowServer >/dev/null
          pgrep -x Finder >/dev/null
          spctl --status 2>&1 | grep -Fx 'assessments enabled'
          printf 'SHA256=%s\n' "$EXPECTED"

          python="$(command -v python3 || true)"
          chrome='/Applications/Google Chrome.app/Contents/MacOS/Google Chrome'
          if [[ -z "$python" || ! -x "$python" || ! -x "$chrome" || ! -s "$private/redirect" ]]; then
            printf 'resultado=no_verificado; motivo=falta Python, Chrome o la redirección HTTPS temporal.\n'
            exit 1
          fi
          downloads="$HOME/Downloads/Mind-piloto-https"
          archive="$downloads/$ASSET"
          profile="$private/chrome"
          mkdir -p "$profile/Default" "$downloads"
          "$python" -I -B - "$profile" "$downloads" <<'PY'
          import json
          from pathlib import Path
          from sys import argv

          preferences = Path(argv[1]) / 'Default' / 'Preferences'
          preferences.write_text(json.dumps({
              'download': {'default_directory': argv[2], 'prompt_for_download': False},
          }), encoding='utf8')
          PY
          url="$(cat "$private/redirect")"
          case "$url" in
            https://release-assets.githubusercontent.com/*|https://objects.githubusercontent.com/*) ;;
            *) echo 'resultado=no_verificado; motivo=destino HTTPS inesperado.'; exit 1 ;;
          esac
          "$chrome" --user-data-dir="$profile" --no-first-run --no-default-browser-check "$url" \
            >"$private/chrome.log" 2>&1 &
          browser=$!
          unset url
          trap 'kill -TERM "$browser" 2>/dev/null || true' EXIT
          has_quarantine() { /usr/bin/xattr -p com.apple.quarantine "$1" >/dev/null 2>&1; }
          for (( i = 0; i < 150; i++ )); do
            if [[ -f "$archive" ]] && [[ "$(stat -f %z "$archive")" == "$EXPECTED_BYTES" ]] \
              && has_quarantine "$archive"; then break; fi
            if ! kill -0 "$browser" 2>/dev/null; then break; fi
            sleep 1
          done
          kill -TERM "$browser" 2>/dev/null || true
          for (( i = 0; i < 12; i++ )); do
            if ! kill -0 "$browser" 2>/dev/null; then break; fi
            sleep 1
          done
          if kill -0 "$browser" 2>/dev/null; then
            printf 'resultado=no_verificado; motivo=Chrome sigue abierto; no se captura la sesión.\n'
            exit 1
          fi
          wait "$browser" || true
          trap - EXIT
          size=0
          if [[ -f "$archive" ]]; then size="$(stat -f %z "$archive")"; fi
          printf 'chrome_archivo_bytes=%s\n' "$size"
          if [[ "$size" != "$EXPECTED_BYTES" ]] || ! has_quarantine "$archive"; then
            printf 'resultado=no_verificado; motivo=Chrome no dejó el archivo completo con cuarentena natural.\n'
            exit 1
          fi
          printf '%s  %s\n' "$EXPECTED" "$archive" | shasum -a 256 -c - >/dev/null
          printf 'descarga=chrome; transporte=https; huella=coincide; cuarentena_archivo=presente\n'

          detect_product() {
            "$python" -I -B - "$downloads" "$EXPECTED_ARCH" <<'PY'
          import json
          from pathlib import Path
          from sys import argv

          root = Path(argv[1]).resolve()
          arch = 'x64' if argv[2] == 'x86_64' else argv[2]
          target = 'darwin-' + arch
          targets = {'win32-x64', 'darwin-x64', 'darwin-arm64', 'linux-x64', 'linux-arm64'}
          for glob in ('*/mind-producto.json', '*/*/mind-producto.json'):
              for manifest in root.glob(glob):
                  if not manifest.resolve().is_relative_to(root):
                      continue
                  try:
                      data = json.loads(manifest.read_text(encoding='utf-8'))
                  except (OSError, ValueError):
                      continue
                  if (data.get('mindVersion') == '1.0.2'
                      and data.get('builtFrom') == '1b42e120d529a923f991988a79d1e92b316a947f'
                      and set(data.get('targets', [])) == targets
                      and (manifest.parent / 'mind').is_file()
                      and (manifest.parent / 'Runtime' / target / 'node/bin/node').is_file()
                      and (manifest.parent / 'Runtime' / target / 'python/bin/python3').is_file()):
                      print(manifest.parent)
                      raise SystemExit(0)
          raise SystemExit(1)
          PY
          }

          test_connection() {
            "$python" -I -B - "$product" "$private/fixture" "$EXPECTED_ARCH" <<'PY'
          import json
          import os
          from pathlib import Path
          import select
          import subprocess
          import sys
          import time

          root, fixture = map(Path, sys.argv[1:3])
          arch = 'x64' if sys.argv[3] == 'x86_64' else sys.argv[3]
          runtime = Path('Runtime') / ('darwin-' + arch)
          node = runtime / 'node/bin/node'
          python = runtime / 'python/bin/python3'
          launcher = root / 'mind'
          configuration = root / '.mcp.json'
          fixture.mkdir()
          empty_path = fixture / 'sin-programas'
          empty_path.mkdir()
          note = 'contenido-ficticio-apertura-mac'
          (fixture / 'nota.txt').write_text(note, encoding='utf-8')
          if configuration.exists() or (root / 'Base').exists() or not os.access(launcher, os.X_OK):
              raise SystemExit(1)
          environment = {key: value for key, value in os.environ.items() if key.upper() not in {
              'PATH', 'MIND_BASE', 'MIND_PYTHON', 'NODE_OPTIONS', 'NODE_PATH', 'GH_TOKEN', 'GITHUB_TOKEN',
              'PYTHONHOME', 'PYTHONPATH',
          }}
          # Mantiene fijos los bytes descargados. La actualización se prueba en la matriz.
          environment.update({'PATH': str(empty_path), 'MIND_UPDATE_RESTART': '1'})

          def quarantine(file):
              outcome = subprocess.run(
                  ['/usr/bin/xattr', '-p', 'com.apple.quarantine', file],
                  capture_output=True, timeout=8,
              )
              return outcome.stdout if outcome.returncode == 0 else None

          active_before = quarantine(root / python)
          inactive = root / 'Runtime/node/node.exe'
          inactive_before = quarantine(inactive)
          print('cuarentena_python_antes=' + ('presente' if active_before is not None else 'ausente'), flush=True)
          prepared = subprocess.run(
              ['./mind', 'preparar'], cwd=root, env=environment, capture_output=True, timeout=40,
          )
          if prepared.returncode != 0 or (root / 'Base').exists():
              raise SystemExit(1)
          print('iniciador_preparar=superado', flush=True)
          config = json.loads(configuration.read_text(encoding='utf-8'))['mcpServers']['mind']
          if config['command'] != node.as_posix() or config['args'] != ['Motor/bin/mind.js', 'mcp']:
              raise SystemExit(1)
          print('mcp_config_nativa=superada', flush=True)
          environment.update(config.get('env', {}))
          process = subprocess.Popen(
              [str(root / node), *config['args'], '--carpeta', str(fixture)],
              cwd=root, env=environment, stdin=subprocess.PIPE, stdout=subprocess.PIPE,
              stderr=subprocess.DEVNULL, bufsize=0,
          )
          try:
              def send(message):
                  process.stdin.write((json.dumps({'jsonrpc': '2.0', **message}) + '\n').encode())
                  process.stdin.flush()

              def result(request_id):
                  deadline = time.monotonic() + 55
                  while (remaining := deadline - time.monotonic()) > 0:
                      if not select.select([process.stdout], [], [], remaining)[0]:
                          break
                      line = process.stdout.readline()
                      if not line:
                          break
                      response = json.loads(line)
                      if response.get('id') == request_id and 'result' in response:
                          return response['result']
                  raise SystemExit(1)

              send({'id': 1, 'method': 'initialize', 'params': {
                  'protocolVersion': '2025-03-26', 'capabilities': {},
                  'clientInfo': {'name': 'cliente-ficticio-piloto', 'version': '1.0'},
              }})
              info = result(1).get('serverInfo', {})
              if (info.get('name'), info.get('version')) != ('mind', '1.0.2'):
                  raise SystemExit(1)
              print('conexion_mcp=superada', flush=True)
              send({'method': 'notifications/initialized'})
              send({'id': 2, 'method': 'tools/call', 'params': {
                  'name': 'estado', 'arguments': {},
              }})
              state = result(2).get('structuredContent', {}).get('mind', {})
              executables = state.get('runtime', {})
              if (state.get('motor') != '1.0.2'
                  or Path(executables.get('node', '')).resolve() != (root / node).resolve()
                  or Path(executables.get('python', '')).resolve() != (root / python).resolve()):
                  raise SystemExit(1)
              print('runtimes_nativos=superados', flush=True)
              send({'id': 3, 'method': 'tools/call', 'params': {
                  'name': 'leer', 'arguments': {'ruta': 'nota.txt'},
              }})
              read = result(3)
              if read.get('isError') or read.get('structuredContent', {}).get('contenido') != note:
                  raise SystemExit(1)
              print('lectura_ficticia=superada', flush=True)
          finally:
              process.stdin.close()
              try:
                  process.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  process.terminate()
                  process.wait(timeout=10)
          if process.returncode != 0:
              raise SystemExit(1)
          print('cierre_mcp=superado', flush=True)
          if quarantine(inactive) != inactive_before:
              raise SystemExit(1)
          if active_before is not None and quarantine(root / python) is not None:
              raise SystemExit(1)
          if active_before is not None:
              print('cuarentena_python_activa=retirada_por_mind', flush=True)
          print('cuarentena_runtime_inactivo=sin_cambios', flush=True)
          PY
          }

          utility='/System/Library/CoreServices/Applications/Archive Utility.app'
          if [[ -d "$utility" ]]; then
            /usr/bin/open -a "$utility" "$archive" >"$private/open-archive.log" 2>&1 || true
          else
            /usr/bin/open "$archive" >"$private/open-archive.log" 2>&1 || true
          fi
          product=''
          for (( i = 0; i < 120; i++ )); do
            if product="$(detect_product 2>/dev/null)"; then break; fi
            product=''
            sleep 1
          done
          if [[ -z "$product" ]]; then
            printf 'extraccion_launchservices=no_completada\n'

            printf 'resultado=no_verificado; motivo=LaunchServices no entregó la carpeta extraída.\n'
            exit 1
          fi
          if ! has_quarantine "$product/Autorizar Mind.command"; then
            printf 'extraccion_launchservices=completada; cuarentena_iniciador=ausente\n'
            printf 'resultado=no_verificado; motivo=el iniciador extraído no conserva cuarentena natural.\n'
            exit 1
          fi
          printf 'extraccion_launchservices=completada; cuarentena_iniciador=presente\n'

          if ! test_connection >"$private/mcp.log" 2>&1; then
            grep -Ex 'iniciador_preparar=superado|mcp_config_nativa=superada|conexion_mcp=superada|runtimes_nativos=superados|lectura_ficticia=superada|cierre_mcp=superado|cuarentena_python_antes=(presente|ausente)|cuarentena_python_activa=retirada_por_mind|cuarentena_runtime_inactivo=sin_cambios' "$private/mcp.log" || true
            printf 'resultado=no_verificado; motivo=la prueba de runtime o MCP no terminó correctamente.\n'
            exit 1
          fi
          grep -Ex 'iniciador_preparar=superado|mcp_config_nativa=superada|conexion_mcp=superada|runtimes_nativos=superados|lectura_ficticia=superada|cierre_mcp=superado|cuarentena_python_antes=(presente|ausente)|cuarentena_python_activa=retirada_por_mind|cuarentena_runtime_inactivo=sin_cambios' "$private/mcp.log"
          spctl --status 2>&1 | grep -Fx 'assessments enabled'
          printf 'resultado=superado; prueba=./mind preparar y cliente MCP ficticio tras descarga y extracción natural, sin abrir .command.\n'
      - name: Conservar únicamente evidencia de prueba
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: primer-uso-zip-universal-mac-${{ matrix.arch }}
          path: ${{ runner.temp }}/mind-gui-evidence/
          retention-days: 1
          if-no-files-found: warn
