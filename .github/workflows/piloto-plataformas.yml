name: Prueba de lectura de borrador Mind

on:
  push:
    branches:
      - codex/piloto-paridad

permissions: {}

jobs:
  probar:
    if: github.actor == 'byaldodaniel' && github.triggering_actor == 'byaldodaniel'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Leer un asset ficticio por ID con el token efímero del repositorio
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          endpoint="repos/$GITHUB_REPOSITORY/releases/assets/715547249"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "https://api.github.com/$endpoint")"
          printf 'Acceso anónimo: %s\n' "$status"
          case "$status" in
            403|404) ;;
            *) exit 1 ;;
          esac
          asset="$RUNNER_TEMP/prueba-acceso.txt"
          gh api --method GET -H 'Accept: application/octet-stream' "$endpoint" > "$asset"
          printf '%s  %s\n' '09eecfcef93152d39f882589de6464257c69e918c8821e2e683aac58cc9c41c6' "$asset" | sha256sum --check --status
          printf 'Contenido y SHA-256 verificados con el token efímero de contenido.\n'
